[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epivintage-research-explorer"
version = "0.1.0"
description = "Demonstration of vintage-aware epidemic situational assessment analysis"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.25,<1", "pandas>=2.0,<3", "numpy>=1.26,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.package-data]
epivintage = ["index.html"]
