<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Mean terminal delay under four synthetic scenarios</title>
<desc id="chart-desc">Mean delays in seconds: 136.0, 405.2, 76.2, 63.4. Model outputs, not observed railway performance.</desc>
<rect width="1000" height="390" fill="#f2f6f8"/>
<g font-family="Arial,sans-serif" fill="#18283b">
<text x="30" y="37" font-size="23" font-weight="bold">Mean terminal delay</text>
<text x="30" y="64" font-size="15">Synthetic corridor | 200 replications | seed 20261118 | seconds</text>
<text x="30" y="118" font-size="16">Four minute service</text>
<rect x="255" y="95" width="204.69" height="34" fill="#287785" rx="3"/>
<text x="471.69" y="118" font-size="17">136.0</text>
<text x="30" y="179" font-size="16">Three minute service</text>
<rect x="255" y="156" width="610.00" height="34" fill="#ad543c" rx="3"/>
<text x="877.00" y="179" font-size="17">405.2</text>
<text x="30" y="240" font-size="16">Add timetable recovery</text>
<rect x="255" y="217" width="114.68" height="34" fill="#287785" rx="3"/>
<text x="381.68" y="240" font-size="17">76.2</text>
<text x="30" y="301" font-size="16">Lower dwell variability</text>
<rect x="255" y="278" width="95.46" height="34" fill="#287785" rx="3"/>
<text x="362.46" y="301" font-size="17">63.4</text>
<text x="30" y="365" font-size="14">Recovery extends the scheduled journey by 60 s. Compare the full metrics before judging benefits.</text>
</g></svg>